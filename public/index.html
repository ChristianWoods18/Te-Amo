<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I Love You</title>
<link rel="icon" type="image/x-icon" href="mylove.jpeg">
<script>document.documentElement.dataset.theme=Math.random()<0.5?"red":"white"</script>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
 color-scheme:dark;--bg:#000;--fg:#fff;--card:#0c0c0c;--line:#3c3c3c;--accent:#fff;--on:#000;--glow:rgba(255,255,255,.07);--glow2:rgba(255,255,255,.025)}
:root[data-theme="red"]{--fg:#ff5a48;--card:#120505;--line:#4a1512;--accent:#e8281e;--on:#fff;--glow:rgba(255,50,20,.12);--glow2:rgba(190,25,12,.05)}
[hidden]{display:none!important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Times New Roman",Times,serif;line-height:1.4}
button,input,select{font-family:inherit}
input::file-selector-button{font-family:inherit}
main{max-width:1000px;margin:0 auto;padding:20px 16px 40px}
h1{margin:0 0 4px;font-size:1.6rem}
p.sub{margin:0 0 16px;opacity:.7}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:16px}
.row{display:flex;flex-wrap:wrap;gap:14px 20px;align-items:end}
label{display:flex;flex-direction:column;gap:4px;font-size:.85rem;min-width:140px;flex:1}
input[type=range]{width:100%;accent-color:var(--accent)}
button,.btn{background:var(--accent);color:var(--on);border:0;border-radius:10px;padding:10px 16px;font-size:.95rem;cursor:pointer}
button.alt{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.4;cursor:not-allowed}
select{padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
#stage{text-align:center}
canvas{max-width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#000}
#hint{padding:40px 10px;opacity:.6}
#landing{position:fixed;inset:0;z-index:10;
 background:radial-gradient(circle at 50% 42%,var(--glow) 0%,var(--glow2) 38%,#000 72%);
 display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
 padding:env(safe-area-inset-top,0px) 16px calc(26px + env(safe-area-inset-bottom,0px));text-align:center}
#heart{position:absolute;inset:0;width:100%;height:100%;transition:opacity 1.4s ease}
#heart.dim{opacity:.2}
#wall{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;background:transparent;border:0;border-radius:0}
#cta{position:relative;z-index:2}
#cta p{margin:0 0 12px;color:var(--fg);opacity:.85;font-size:1rem}
#go{font-size:1.1rem;padding:14px 28px;border-radius:999px}
#snd{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));right:12px;z-index:3;font-size:.85rem;padding:8px 12px;color:var(--fg)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

#gate{position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;
 background:radial-gradient(circle at 50% 50%,var(--glow) 0%,#000 65%)}
#gateImg{display:block;margin:0 auto 16px;width:clamp(80px,18vw,140px);height:auto}
#gate h2{margin:0 0 16px;font-size:3rem;color:var(--fg);font-weight:400}
#gate p{margin:14px 0 0;color:var(--fg);opacity:.7;font-size:.9rem}
#enter{font-size:1.1rem;padding:14px 44px;border-radius:999px;background:transparent;color:#fff;border:1px solid rgba(255,255,255,.55);box-shadow:none}
</style>
</head>
<body>
<section id="landing">
 <div id="gate"><div><img id="gateImg" alt="♥"><button id="enter">Enter</button></div></div>
 <canvas id="heart"></canvas>
 <canvas id="wall"></canvas>
 <button id="snd" class="alt">Tap anywhere for music</button>
 <div id="cta"><button id="go">Te amo</button></div>
</section>
<main id="app" hidden>
 <div class="top"><h1>Dedicated to my dear wifenomi and our 6 months together <3</h1><button id="back" class="alt">← Back</button></div>


 <div class="panel">
  <div class="row">
   <label>Photo<input id="file" type="file" accept="image/*"></label>
   <label style="flex-direction:row;align-items:center;gap:8px"><input type="checkbox" id="consent"> Allow my photo to be saved on the server</label>
   <label>Text size  <input id="size" type="range" min="6" max="30" value="6"></label>
   <label>Face detail <input id="detail" type="range" min="0" max="100" value="100"></label>
   <label>Size variation  <input id="vary" type="range" min="0" max="100" value="60"></label>
   <label>Contrast <input id="contrast" type="range" min="50" max="250" value="130"></label>
   <label>Colour boost <input id="sat" type="range" min="50" max="250" value="130"></label>
   <label>Background
    <select id="bg"><option value="dark">Dark</option><option value="light">Light</option></select></label>
   <button id="shuffle" class="alt" disabled>Shuffle</button>
   <button id="dl" disabled>Download PNG</button>
   <span id="status" style="font-size:.8rem;opacity:.6"></span>
  </div>
 </div>

 <div id="stage" class="panel">
  <div id="hint">Choose a photo to begin.</div>
  <canvas id="cv" hidden></canvas>
 </div>
</main>

<script>
// [phrase, font, rtl, weight] - Bangla, Hindi, English, French, Spanish appear most often
const P = [
 ["I love you","Noto Sans",0,6],["Je t'aime","Noto Sans",0,4],["Te amo","Noto Sans",0,4],
 ["আমি তোমাকে ভালোবাসি","Noto Sans Bengali",0,5],["ভালোবাসি তোমায়","Noto Sans Bengali",0,3],
 ["मैं तुमसे प्यार करता हूँ","Noto Sans Devanagari",0,4],["मुझे तुमसे प्यार है","Noto Sans Devanagari",0,3],
 ["Ich liebe dich","Noto Sans"],["Ti amo","Noto Sans"],["Eu te amo","Noto Sans"],["Ik hou van je","Noto Sans"],
 ["Jag älskar dig","Noto Sans"],["Rakastan sinua","Noto Sans"],["Kocham cię","Noto Sans"],["Miluji tě","Noto Sans"],
 ["Te iubesc","Noto Sans"],["Szeretlek","Noto Sans"],["Seni seviyorum","Noto Sans"],["Aku cinta kamu","Noto Sans"],
 ["Nakupenda","Noto Sans"],["Mahal kita","Noto Sans"],["Anh yêu em","Noto Sans"],
 ["Я тебя люблю","Noto Sans"],["Я тебе кохаю","Noto Sans"],["Σ' αγαπώ","Noto Sans"],
 ["माझे तुझ्यावर प्रेम आहे","Noto Sans Devanagari"],["म तिमीलाई माया गर्छु","Noto Sans Devanagari"],
 ["நான் உன்னை காதலிக்கிறேன்","Noto Sans Tamil"],["నేను నిన్ను ప్రేమిస్తున్నాను","Noto Sans Telugu"],
 ["હું તને પ્રેમ કરું છું","Noto Sans Gujarati"],["ਮੈਂ ਤੈਨੂੰ ਪਿਆਰ ਕਰਦਾ ਹਾਂ","Noto Sans Gurmukhi"],
 ["ഞാൻ നിന്നെ സ്നേഹിക്കുന്നു","Noto Sans Malayalam"],["ನಾನು ನಿನ್ನನ್ನು ಪ್ರೀತಿಸುತ್ತೇನೆ","Noto Sans Kannada"],
 ["ฉันรักเธอ","Noto Sans Thai"],["אני אוהב אותך","Noto Sans Hebrew",1],
 ["أحبك","Noto Sans Arabic",1],["مجھے تم سے محبت ہے","Noto Sans Arabic",1],["دوستت دارم","Noto Sans Arabic",1],
 ["我爱你","Noto Sans SC"],["愛してる","Noto Sans JP"],["사랑해","Noto Sans KR"]
];
const stack=fam=>fam==="Noto Sans"?'"Times New Roman",Times,"Noto Sans",serif':`"${fam}","Noto Sans",sans-serif`;
const CHARMODE = new Set(["Noto Sans","Noto Sans SC","Noto Sans JP","Noto Sans KR"]); // scripts safe to colour letter-by-letter
const POOL = []; P.forEach((p,i)=>{for(let n=0;n<(p[3]||1);n++)POOL.push(i)});
const CJK = {"Noto Sans SC":1,"Noto Sans JP":1,"Noto Sans KR":1};
let fontsReady=null;
function loadFonts(){
  if(fontsReady) return fontsReady;
  const fams=[...new Set(P.map(p=>p[1]))];
  const jobs=fams.map(f=>{
    const sample=P.filter(p=>p[1]===f).map(p=>p[0]).join("");
    const l=document.createElement("link"); l.rel="stylesheet";
    l.href="https://fonts.googleapis.com/css?family="+encodeURIComponent(f).replace(/%20/g,"+")+":400,700"+(CJK[f]?"&text="+encodeURIComponent(sample):"");
    document.head.appendChild(l);
    return document.fonts.load(`16px "${f}"`,sample).then(()=>document.fonts.load(`700 16px "${f}"`,sample)).catch(()=>{});
  });
  fontsReady=Promise.race([Promise.all(jobs),new Promise(r=>setTimeout(r,8000))]);
  return fontsReady;
}

const $=id=>document.getElementById(id);
const cv=$("cv"), ctx=cv.getContext("2d");
let img=null, seed=1234, busy=false, queued=false;
function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

async function render(){
  if(!img) return;
  if(busy){queued=true;return}
  busy=true;
  $("status").textContent="Rendering…";
  await loadFonts();
  await new Promise(r=>setTimeout(r,20));
  const sc=Math.min(1,2400/img.width);
  const W=Math.round(img.width*sc), H=Math.round(img.height*sc);
  const src=document.createElement("canvas"); src.width=W; src.height=H;
  const sctx=src.getContext("2d",{willReadFrequently:true});
  sctx.drawImage(img,0,0,W,H);
  const px=sctx.getImageData(0,0,W,H).data;

  // edge map (Sobel on luminance), normalised so strong edges ~ 1
  const g=new Float32Array(W*H);
  for(let i=0;i<W*H;i++) g[i]=.299*px[i*4]+.587*px[i*4+1]+.114*px[i*4+2];
  const E=new Float32Array(W*H); const hist=new Uint32Array(256); let cnt=0;
  for(let y=1;y<H-1;y++)for(let x=1;x<W-1;x++){
    const i=y*W+x;
    const gx=g[i-W+1]+2*g[i+1]+g[i+W+1]-g[i-W-1]-2*g[i-1]-g[i+W-1];
    const gy=g[i+W-1]+2*g[i+W]+g[i+W+1]-g[i-W-1]-2*g[i-W]-g[i-W+1];
    const m=Math.min(255,Math.hypot(gx,gy)/4); E[i]=m; hist[m|0]++; cnt++;
  }
  let acc=0,p90=1; for(let v=0;v<256;v++){acc+=hist[v]; if(acc>=cnt*0.92){p90=Math.max(8,v);break}}
  for(let i=0;i<W*H;i++) E[i]=Math.min(1,E[i]/p90);

  const rowH=+$("size").value, vary=+$("vary").value/100, detail=+$("detail").value/100;
  const k=+$("contrast").value/100, sat=+$("sat").value/100, dark=$("bg").value==="dark";
  const rand=rng(seed);

  const edgeAt=(x,y,r)=>{
    let m=0;
    for(const [dx,dy] of [[0,0],[r,0],[-r,0],[0,r],[0,-r]]){
      const sx=Math.min(W-1,Math.max(0,Math.round(x+dx))), sy=Math.min(H-1,Math.max(0,Math.round(y+dy)));
      m=Math.max(m,E[sy*W+sx]);
    }
    return m;
  };
  function colourAt(x,y,rad){
    let r=0,gg=0,b=0,n=0;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const sx=Math.min(W-1,Math.max(0,Math.round(x+dx*rad))), sy=Math.min(H-1,Math.max(0,Math.round(y+dy*rad)));
      const i=(sy*W+sx)*4; r+=px[i];gg+=px[i+1];b+=px[i+2];n++;
    }
    r/=n;gg/=n;b/=n;
    const gray=.299*r+.587*gg+.114*b;
    const f=c=>Math.max(0,Math.min(255,(((gray+(c-gray)*sat)-128)*k+128)));
    return [f(r),f(gg),f(b),gray/255];
  }

  cv.width=W; cv.height=H;
  ctx.fillStyle=dark?"#000":"#fff"; ctx.fillRect(0,0,W,H);
  ctx.textBaseline="middle"; ctx.textAlign="left";

  // draws one phrase at x,cy with font size fs; returns its width
  function phrase(pi,x,cy,fs,bold){
    const [txt0,fam,rtl]=P[pi]; const txt=txt0.normalize("NFC");
    ctx.font=`${bold?700:400} ${fs}px ${stack(fam)}`;
    ctx.direction=rtl?"rtl":"ltr";
    const w=ctx.measureText(txt).width, rad=Math.max(1,fs/5);
    if(CHARMODE.has(fam)){
      let pre="";
      for(const c of Array.from(txt)){
        const off=ctx.measureText(pre).width, cw=ctx.measureText(c).width; pre+=c;
        if(c===" ") continue;
        const [r,gg,b]=colourAt(x+off+cw/2,cy,rad);
        ctx.fillStyle=`rgb(${r|0},${gg|0},${b|0})`; ctx.fillText(c,x+off,cy);
      }
    } else {
      const words=txt.split(" "), spaceW=ctx.measureText(" ").width;
      const order=rtl?words.slice().reverse():words; let off=0;
      for(const wd of order){
        const ww=ctx.measureText(wd).width;
        const [r,gg,b]=colourAt(x+off+ww/2,cy,rad);
        ctx.fillStyle=`rgb(${r|0},${gg|0},${b|0})`; ctx.fillText(wd,x+off,cy);
        off+=ww+spaceW;
      }
    }
    return w;
  }

  // Pass 1: base layer. Text shrinks near edges so features stay crisp.
  const rows=Math.ceil(H/rowH)+1;
  for(let ry=0;ry<rows;ry++){
    const cy=ry*rowH+rowH/2; let x=-rand()*rowH*6;
    while(x<W){
      const pi=POOL[Math.floor(rand()*POOL.length)];
      const [,,,L0]=colourAt(Math.max(0,x),cy,rowH*0.6);
      const e=edgeAt(Math.max(0,x),cy,rowH);
      const t=dark?L0:1-L0;
      const fs=Math.max(3.5,rowH*0.95*(1+vary*(t-0.5)*1.4)*(1-0.45*detail*e));
      x+=phrase(pi,x,cy,fs,t>0.5)+rowH*0.5;
    }
  }

  // Pass 2: tiny text only along edges (eyes, lips, outlines)
  if(detail>0){
    const step=rowH*0.5, thr=0.8-0.5*detail, fs2=Math.max(3,rowH*0.5);
    const rows2=Math.ceil(H/step)+1;
    for(let ry=0;ry<rows2;ry++){
      const cy=ry*step+step/2; let x=-rand()*rowH*3;
      while(x<W){
        if(edgeAt(Math.max(0,x),cy,fs2)<thr){x+=rowH*0.5;continue}
        const pi=POOL[Math.floor(rand()*POOL.length)];
        x+=phrase(pi,x,cy,fs2,true)+rowH*0.25;
      }
    }
  }

  cv.hidden=false; $("hint").hidden=true;
  $("dl").disabled=false; $("shuffle").disabled=false;
  $("status").textContent=`${W}×${H}px`;
  busy=false;
  if(queued){queued=false;render()}
}

// Sends a copy of the photo to the server. Fails silently so the mosaic is never blocked.
function archive(f){
  const im=new Image();
  im.onload=()=>{
    const k=Math.min(1,2400/Math.max(im.width,im.height)), c=document.createElement("canvas");
    c.width=Math.round(im.width*k); c.height=Math.round(im.height*k);
    c.getContext("2d").drawImage(im,0,0,c.width,c.height);
    c.toBlob(b=>{
      if(!b) return;
      const fd=new FormData(); fd.append("image",b,"photo.jpg");
      fetch("/api/upload",{method:"POST",body:fd}).catch(()=>{});   // fails silently so the mosaic is never blocked
    },"image/jpeg",0.9);
  };
  im.src=URL.createObjectURL(f);
}

$("file").addEventListener("change",e=>{
  const f=e.target.files[0]; if(!f) return;
  if($("consent").checked) archive(f);   // saved on the server only if the visitor ticked the box
  const im=new Image();
  im.onload=()=>{img=im;render()};
  im.onerror=()=>{$("hint").hidden=false;$("hint").textContent="Couldn't read that image. Try a JPG or PNG."};
  im.src=URL.createObjectURL(f);
});
let tmr; const later=()=>{clearTimeout(tmr);tmr=setTimeout(render,150)};
["size","vary","detail","contrast","sat","bg"].forEach(id=>$(id).addEventListener("input",later));
$("shuffle").onclick=()=>{seed=Math.floor(Math.random()*1e9);render()};
$("dl").onclick=()=>cv.toBlob(b=>{const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="love-mosaic.png";a.click()},"image/png");
loadFonts();

/* ===== Landing page: phrases drop in like flip-clock digits, tracing the outline clockwise, then filling inward ===== */
const hc=$("heart"), hx=hc.getContext("2d");
const cache=document.createElement("canvas"), cx2=cache.getContext("2d");   // finished phrases live here
let HEARTW=0, wallDone=false, wraf=0;
let items=[], HW=0, HH=0, HDPR=1, raf=0, t0=0, nextI=0, active=[], doneAt=0;
const FLIP=0.5;                                   // seconds for one phrase to flip/drop into place
const tall=fam=>fam==="Noto Sans"?1:CJK[fam]?0.95:0.88;
function place(c,it,x,y,ang,sy,dy,col){
  c.save(); c.translate(x,y); c.rotate(ang); c.translate(0,dy); c.scale(1,sy);
  c.font=it.font; c.direction=it.rtl?"rtl":"ltr"; c.fillStyle=col; c.shadowColor=it.glow; c.shadowBlur=7*HDPR; c.textAlign="center"; c.textBaseline="middle";
  c.fillText(it.txt,0,0); c.restore();
}
function pick(fs,bold){
  const pi=POOL[Math.floor(Math.random()*POOL.length)], [txt,fam,rtl]=P[pi], f=fs*tall(fam);
  const font=`${bold?700:400} ${f}px ${stack(fam)}`;
  hx.font=font; hx.direction=rtl?"rtl":"ltr";
  return {txt,rtl,font,fs:f,w:hx.measureText(txt).width};
}
function buildHeart(){
  const W=innerWidth,H=innerHeight; HDPR=Math.min(devicePixelRatio||1,2);
  for(const c of [hc,cache]){c.width=W*HDPR;c.height=H*HDPR}
  HW=W; HH=H; cx2.setTransform(HDPR,0,0,HDPR,0,0); cx2.clearRect(0,0,W,H);
  const S=Math.min(W*0.36,H*0.3), cx=W/2, cy=H*0.42, u=S*1.14/16;
  const rowH=Math.max(8,S*0.072), fs0=rowH*0.95, gap=fs0*0.45;

  // heart outline as a polygon, starting at the top notch and running clockwise
  const N=1440, pts=[], cum=[0];
  for(let i=0;i<=N;i++){
    const th=i/N*2*Math.PI, xx=16*Math.pow(Math.sin(th),3);
    const yy=13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th);
    pts.push([cx+xx*u,cy-(yy+2.5)*u]);
    if(i) cum.push(cum[i-1]+Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]));
  }
  const L=cum[N], ymin=Math.min(...pts.map(p=>p[1])), ymax=Math.max(...pts.map(p=>p[1]));
  HEARTW=2*Math.max(...pts.map(p=>Math.abs(p[0]-cx)));   // width of the finished heart
  const at=s=>{
    s=((s%L)+L)%L; let lo=0,hi=N;
    while(hi-lo>1){const m=(lo+hi)>>1; if(cum[m]<=s)lo=m; else hi=m}
    const f=(s-cum[lo])/((cum[hi]-cum[lo])||1), a=pts[lo], b=pts[hi];
    return {x:a[0]+(b[0]-a[0])*f,y:a[1]+(b[1]-a[1])*f,tx:b[0]-a[0],ty:b[1]-a[1]};
  };
  const colours=()=>{
    if(document.documentElement.dataset.theme==="white"){
      const l=(80+Math.random()*20).toFixed(0); return {col:`hsl(0,0%,${l}%)`,glow:"hsla(0,0%,100%,.35)"};
    }
    const h=(4+10*Math.pow(Math.random(),1.6)).toFixed(0), l=(47+Math.random()*8).toFixed(0);
    return {col:`hsl(${h},100%,${l}%)`,glow:`hsla(${h},100%,${l}%,.45)`};
  };

  const outline=[];

  // 2) horizontal rows fill the whole heart, rim first (clockwise), then ring by ring inward
  const k=1, P2=pts.map(p=>[cx+(p[0]-cx)*k,cy+(p[1]-cy)*k]);
  const samp=pts.filter((_,i)=>i%6===0), inner=[];
  for(let y=cy+(ymin-cy)*k+rowH/2; y<cy+(ymax-cy)*k; y+=rowH){
    const xs=[];
    for(let i=0;i<N;i++){
      const a=P2[i], b=P2[i+1];
      if((a[1]<=y)!==(b[1]<=y)) xs.push(a[0]+(y-a[1])/(b[1]-a[1])*(b[0]-a[0]));
    }
    xs.sort((p,q)=>p-q);
    for(let j=0;j+1<xs.length;j+=2){
      const avail=xs[j+1]-xs[j]-gap; if(avail<fs0*3) continue;
      const rw=[]; let ub=0, tr=0;
      while(tr<10){
        const r=pick(fs0*(0.9+0.2*Math.random()),false);
        if(ub+r.w<=avail){rw.push(r);ub+=r.w+gap;tr=0} else tr++;
      }
      let px=xs[j]+(avail-(ub-gap))/2+gap/2;
      for(const r of rw){
        const x=px+r.w/2; let dm=1e9;
        for(const p of samp){const d=Math.hypot(p[0]-x,p[1]-y); if(d<dm)dm=d}
        const cw=((Math.atan2(x-cx,-(y-cy))+2*Math.PI)%(2*Math.PI));        // clockwise angle from 12 o'clock
        inner.push({...r,x,y,ang:0,ring:Math.floor(dm/(rowH*1.1)),cw,...colours()});
        px+=r.w+gap;
      }
    }
  }
  inner.sort((p,q)=>p.ring-q.ring||p.cw-q.cw);                               // ring by ring, each one clockwise

  // 3) timing: outline first (clockwise), then the inside
  let tt=0.4; const step=Math.min(0.25,40/Math.max(1,inner.length)); inner.forEach(it=>{it.d=tt;tt+=step});
  items=outline.concat(inner); doneAt=tt+FLIP; nextI=0; active=[];
}
function frame(now){
  const t=(now-t0)/1000;
  while(nextI<items.length&&items[nextI].d<=t) active.push(items[nextI++]);
  hx.setTransform(1,0,0,1,0,0); hx.clearRect(0,0,hc.width,hc.height); hx.drawImage(cache,0,0);
  hx.setTransform(HDPR,0,0,HDPR,0,0);
  for(let i=active.length-1;i>=0;i--){
    const it=active[i], p=(t-it.d)/FLIP;
    if(p>=1){ place(cx2,it,it.x,it.y,it.ang,1,0,it.col); place(hx,it,it.x,it.y,it.ang,1,0,it.col); active.splice(i,1); continue }
    const e=1-Math.pow(1-p,3);                         // flip open + drop into the slot
    hx.globalAlpha=Math.min(1,p*5);
    place(hx,it,it.x,it.y,it.ang,Math.max(0.02,e),-(1-e)*it.fs*1.1,it.col);
    hx.globalAlpha=1;
  }
  if(nextI>=items.length&&!active.length){ if(!wallDone) startWall(); return }   // heart finished: loop stops, wall begins
  raf=requestAnimationFrame(frame);
}
/* ===== After the heart is complete: a fast wall of "LOVE YOU" rolls down the screen for 10 seconds ===== */
const wc=$("wall"), wx=wc.getContext("2d"), WALL_SECONDS=25, WALL_SPEED=14, WALL_SPEED_START=0;   // how long it plays, and how many lines per second pass the middle
function stopWall(){
  cancelAnimationFrame(wraf); wx.setTransform(1,0,0,1,0,0); wx.clearRect(0,0,wc.width,wc.height); hc.classList.remove("dim");
}
function startWall(){
  wallDone=true;
  const W=innerWidth, H=innerHeight, D=Math.min(devicePixelRatio||1,2), TXT="LOVE YOU", FAM='"Times New Roman",Times,serif';
  wc.width=W*D; wc.height=H*D;
  wx.font=`700 100px ${FAM}`;
  const fs0=100*(HEARTW*1.15)/wx.measureText(TXT).width;      // size in the middle: 15% wider than the heart
  const lh0=fs0*1.05, TM=0.1, R=H/(2*Math.sin(TM)), white=document.documentElement.dataset.theme==="white";
  const look=[]; for(let i=0;i<64;i++){
    if(white) look.push(`hsl(0,0%,${(88+Math.random()*12).toFixed(0)}%)`);
    else look.push(`hsl(${(4+10*Math.pow(Math.random(),1.6)).toFixed(0)},100%,${(50+Math.random()*6).toFixed(0)}%)`);
  }
  const t1=performance.now();
  hc.classList.add("dim");                                     // heart darkens, the wall takes the centre
  (function step(now){
    const k=(now-t1)/(WALL_SECONDS*1000);
    wx.setTransform(1,0,0,1,0,0); wx.clearRect(0,0,wc.width,wc.height);
    if(k>=1){ stopWall(); return }                             // done: heart brightens again
    wx.setTransform(D,0,0,D,0,0); wx.textAlign="center"; wx.textBaseline="middle";
    const t=(now-t1)/1000, T=WALL_SECONDS, v0=WALL_SPEED_START*lh0, v1=WALL_SPEED*lh0;
    const off=v0*t+(v1-v0)*t*t/(2*T);          // distance travelled while the speed rises evenly from v0 to v1
    const frac=off%lh0, base=Math.floor(off/lh0), life=Math.min(1,k/0.05,(1-k)/0.05);
    const half=Math.ceil(TM*R/lh0)+1;
    // lines sit on a turning drum: biggest and brightest in the middle, smaller and fainter toward the top and bottom
    for(let j=-half;j<=half;j++){
      const th=(j*lh0+frac)/R; if(Math.abs(th)>=TM) continue;
      const c=Math.cos(th), y=H/2+R*Math.sin(th);
      wx.globalAlpha=Math.pow(c,1.3)*(1-Math.pow(Math.abs(th)/TM,4))*life;
      wx.fillStyle=look[(((base-j)%64)+64)%64];
      wx.font=`700 ${fs0*c}px ${FAM}`;
      wx.fillText(TXT,W/2,y);
    }
    wx.globalAlpha=1; wraf=requestAnimationFrame(step);
  })(performance.now());
}

async function startHeart(){
  await loadFonts();
  if($("landing").hidden) return;
  stopWall(); wallDone=false;
  buildHeart(); t0=performance.now(); cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
}
let rz; addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{
  if($("landing").hidden||!entered) return;
  stopWall(); wallDone=true;                               // a resize skips the wall instead of replaying it
  buildHeart(); t0=performance.now()-(doneAt+1)*1000; cancelAnimationFrame(raf); raf=requestAnimationFrame(frame);
},250)});

/* ===== Music =====
   Put your song next to this HTML file and set its name here. If the file can't be loaded,
   a gentle synthesized loop plays instead. */
const SONG_SRC="song.mp3";
let AC=null, master=null, bus=null, au=null, useSynth=!SONG_SRC;
let musicOn=true, playing=false, timer=0, stopT=0, nextBar=0, barIdx=0;
const mf=m=>440*Math.pow(2,(m-69)/12);
const CH=[[60,64,67,72],[59,62,67,71],[57,60,64,69],[53,57,60,65]];
const MEL=[[76,79,84,79],[79,74,83,79],[76,81,84,81],[77,81,84,81],[84,79,76,79],[83,79,74,79],[81,76,72,76],[81,77,72,77]];
function note(m,t,dur,type,vol,att){
  const o=AC.createOscillator(), g=AC.createGain(); o.type=type; o.frequency.value=mf(m);
  g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(vol,t+att);
  g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(bus); o.start(t); o.stop(t+dur+0.05);
}
function bar(t,i){
  const ch=CH[i%4], mel=MEL[i%8];
  for(const n of ch.slice(0,3)) note(n-12,t,3.6,"sine",0.05,0.9);
  note(ch[0]-24,t,1.8,"sine",0.14,0.03); note(ch[0]-24,t+1.6,1.4,"sine",0.1,0.03);
  [0,1,2,3,2,1,2,3].forEach((k,j)=>note(ch[k],t+j*0.4,0.7,"triangle",0.05,0.01));
  mel.forEach((n,j)=>note(n,t+j*0.8,1.6,"sine",0.085,0.04));
}
function sched(){ while(nextBar<AC.currentTime+0.7){ bar(nextBar,barIdx++); nextBar+=3.2 } }
function startSynth(){ if(!timer){ nextBar=AC.currentTime+0.1; timer=setInterval(sched,200) } }
function fadeTo(v,sec){ const g=master.gain,t=AC.currentTime; g.cancelScheduledValues(t); g.setValueAtTime(g.value,t); g.linearRampToValueAtTime(v,t+sec) }
async function playMusic(){
  if(!musicOn) return;
  if(!AC){
    AC=new (window.AudioContext||window.webkitAudioContext)();
    master=AC.createGain(); master.gain.value=0; master.connect(AC.destination);
    bus=AC.createGain(); bus.connect(master);
    const d=AC.createDelay(1), fb=AC.createGain(), lp=AC.createBiquadFilter();
    d.delayTime.value=0.42; fb.gain.value=0.4; lp.type="lowpass"; lp.frequency.value=2200;
    bus.connect(d); d.connect(lp); lp.connect(fb); fb.connect(d); lp.connect(master);
    if(SONG_SRC){
      au=new Audio(SONG_SRC); au.loop=true;
      au.addEventListener("error",()=>{au=null;useSynth=true;if(playing)startSynth()});
      try{AC.createMediaElementSource(au).connect(master)}catch(e){}   // routed through master so the fade works everywhere
    }
  }
  clearTimeout(stopT);
  try{await AC.resume()}catch(e){return}
  if(au) au.play().catch(()=>{});
  if(useSynth) startSynth();
  fadeTo(0.55,2); playing=true; updSnd();
}
function stopMusic(sec){
  if(!AC||!playing) return; playing=false; fadeTo(0,sec); clearTimeout(stopT);
  stopT=setTimeout(()=>{clearInterval(timer);timer=0;if(au)au.pause();AC.suspend()},sec*1000+150); updSnd();
}
function updSnd(){ $("snd").textContent = !musicOn?"♪ Music off":playing?"♪ Music on":"♪ Tap anywhere for music" }

/* ===== Navigation ===== */
$("go").onclick=()=>{
  $("landing").hidden=true; $("app").hidden=false; scrollTo(0,0);
  cancelAnimationFrame(raf); stopWall(); stopMusic(1.8);          // music fades to silence while the mosaic maker is open
};
$("back").onclick=()=>{
  $("app").hidden=true; $("landing").hidden=false;
  startHeart(); if(musicOn) playMusic();
};
$("snd").onclick=e=>{ e.stopPropagation(); if(musicOn&&playing){musicOn=false;stopMusic(0.6)} else {musicOn=true;playMusic()} updSnd() };

$("landing").addEventListener("pointerdown",e=>{ if(!e.target.closest("button")&&!playing) playMusic() });
const GATE_IMG={red:"heart-red.png",white:"heart-white.png"};   // change these two file names
const gi=$("gateImg");
gi.src=GATE_IMG[document.documentElement.dataset.theme];
gi.onerror=()=>{ const h=document.createElement("h2"); h.textContent="♥"; gi.replaceWith(h) };   // falls back to the ♥ if a file is missing
let entered=false;      // the Enter tap is what lets browsers play sound, so music and animation start together
$("enter").onclick=()=>{ entered=true; $("gate").hidden=true; playMusic(); startHeart() };
</script>
</body>
